<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pokédex</title>
  <link rel="stylesheet" href="/dex/static/style.css?v=3">

  <meta name="title" content="Pokédex">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://charles.systems/dex">
  <meta property="og:title" content="Pokédex">
  <!-- <meta property="og:image" content="/dex/static/assets/sprites/376.gif"> metagross -->
   <meta property="og:image" content="/dex/static/raw_sprites/137.gif">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://charles.systems/dex">
  <meta property="twitter:title" content="Pokédex">
  <meta property="twitter:image" content="/dex/static/raw_sprites/137.gif">

  <!-- Optional extras -->
  <meta name="theme-color" content="#ee1515">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Charles Averill">
  <link rel="icon" href="/dex/static/favicon.ico">
</head>
<body class="bg-scrolling">
  <div id="toast-container"></div>
  <div class="screen">
    <div class="top-panel">
      <!-- <div class="status-header">&lt;&lt;STATUS&gt;&gt;</div> -->
      <div class="left" id="stats-box">
        <!-- Stats will be filled in -->
      </div>
    </div>

    <div class="bottom-panel">
      <div class="info left" id="info-box">
        Loading...
      </div>
      <div class="right">
        <img id="sprite" class="pokemon-sprite">
      </div>
    </div>

    <div class="controls">
      <button id="prev">←</button>
      <input type="text" id="search" placeholder="Search by name or number" />
      <button id="next">→</button>
      <button id="random">Random</button>
    </div>
  </div>

  <div class="bottom-bar hidden">
    <button id="load-all-mons">Preload Pokédex Data</button>
    <button id="toggle-bg">Toggle BG Scroll</button>
    <button id="shiny-toggle">Toggle Shinies</button>
    &nbsp;
    <input id="gen-input" list="gen-list" placeholder="Select sprite set" />
    <datalist id="gen-list">
      <option value="default-ani">
      <option value="afd">
      <option value="ani">
      <option value="bwicons">
      <option value="categories">
      <option value="dex">
      <option value="digimon">
      <option value="digimon-backup-2021-11-22">
      <option value="gen1">
      <option value="gen1rb">
      <option value="gen1rg">
      <option value="gen2">
      <option value="gen2g">
      <option value="gen2s">
      <option value="gen3">
      <option value="gen3-2">
      <option value="gen3frlg">
      <option value="gen3rs">
      <option value="gen4">
      <option value="gen4dp">
      <option value="gen4dp-2">
      <option value="gen5">
      <option value="gen5ani">
      <option value="gen5icons">
      <option value="gen6">
      <option value="home">
      <option value="home-centered">
    </datalist>
  </div>

  <button id="bottom-bar-toggle" class="bottom-bar-toggle">▲</button>

  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>

  <script src="/dex/static/pokedex.js?v=3"></script>
</body>
</html>
