<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pokédex</title>
  <link rel="stylesheet" href="/dex/static/style.css?v=1">

  <meta name="title" content="Pokédex">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://charles.systems/dex">
  <meta property="og:title" content="Pokédex">
  <meta property="og:image" content="/dex/static/assets/sprites/376.gif">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://charles.systems/dex">
  <meta property="twitter:title" content="Pokédex">
  <meta property="twitter:image" content="/dex/static/assets/sprites/376.gif">

  <!-- Optional extras -->
  <meta name="theme-color" content="#ee1515">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Charles Averill">
  <link rel="icon" href="/dex/static/favicon.ico">
</head>
<body class="bg-scrolling">
  <div id="toast-container"></div>
  <div class="screen">
    <div class="top-panel">
      <!-- <div class="status-header">&lt;&lt;STATUS&gt;&gt;</div> -->
      <div class="left" id="stats-box">
        <!-- Stats will be filled in -->
      </div>
    </div>

    <div class="bottom-panel">
      <div class="info left" id="info-box">
        Loading...
      </div>
      <div class="right">
        <img id="sprite" class="pokemon-sprite">
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="prev">← Prev</button>
    <input type="text" id="search" placeholder="Search by name or number" />
    <button id="next">Next →</button>
    <button id="random">Random</button>
  </div>

  <div class="bottom-bar">
    <button id="load-all-mons">Preload Pokédex Data</button>
    <button id="toggle-bg">Toggle BG Scroll</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>

  <script src="/dex/static/pokedex.js?v=1"></script>
</body>
</html>
